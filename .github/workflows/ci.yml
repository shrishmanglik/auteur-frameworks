name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Escaped as \${{ }} this was a constant string, so every run in the repo shared
  # one group and each new run cancelled all the others regardless of branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: every commit there must keep its own green record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
